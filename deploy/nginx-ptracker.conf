server {
    listen 80;
    include /etc/nginx/mime.types;
    types { application/manifest+json webmanifest; }
    root /usr/share/nginx/html;
    index index.html;

    location = /version.json {
        alias /usr/share/nginx/html/version.json;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /release-manifest.json {
        alias /usr/share/nginx/html/release-manifest.json;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location ~ ^/(sw-[0-9A-Za-z.+-]+\.js)$ {
        alias /usr/share/nginx/html/$1;
        add_header Cache-Control "no-cache" always;
    }

    location = /service-worker-protocol-v1.js {
        alias /usr/share/nginx/html/service-worker-protocol-v1.js;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        alias /usr/share/nginx/html/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
